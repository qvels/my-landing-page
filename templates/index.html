<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявка на сайт</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            margin-bottom: 20px;
            font-size: 22px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #94a3b8;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #3b82f6;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #2563eb;
        }

        button:disabled {
            background-color: #64748b;
            cursor: not-allowed;
        }

        .status-message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            display: none;
        }

        .status-message.success {
            display: block;
            background-color: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border: 1px solid #22c55e;
        }

        .status-message.error {
            display: block;
            background-color: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid #ef4444;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Оставить заявку</h2>
        <form id="leadForm">
            <div class="form-group">
                <label for="name">Ваше имя</label>
                <input type="text" id="name" name="name" placeholder="Захар" required>
            </div>
            <div class="form-group">
                <label for="phone">Ваш телефон</label>
                <input type="tel" id="phone" name="phone" placeholder="+375 (29) 000-00-00" required>
            </div>
            <button type="submit" id="submitBtn">Получить консультацию</button>
        </form>

        <div id="statusMessage" class="status-message"></div>
    </div>

    <script>
        const form = document.getElementById('leadForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusMessage = document.getElementById('statusMessage');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            // Блокируем кнопку на время отправки
            submitBtn.disabled = true;
            submitBtn.innerText = 'Отправка...';
            statusMessage.className = 'status-message';
            statusMessage.style.display = 'none';

            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;

            try {
                const response = await fetch('/api/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name: name, phone: phone })
                });

                const data = await response.json();

                if (response.ok && data.status === 'success') {
                    statusMessage.innerText = '✓ Заявка успешно отправлена!';
                    statusMessage.className = 'status-message success';
                    form.reset();
                } else {
                    throw new Error(data.message || 'Ошибка при отправке');
                }
            } catch (error) {
                console.error('Ошибка:', error);
                statusMessage.innerText = '✕ Не удалось отправить. Попробуйте еще раз.';
                statusMessage.className = 'status-message error';
            } finally {
                // Возвращаем кнопку в исходное состояние
                submitBtn.disabled = false;
                submitBtn.innerText = 'Получить консультацию';
            }
        });
    </script>
</body>
</html>
